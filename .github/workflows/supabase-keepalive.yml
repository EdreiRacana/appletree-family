name: Supabase Keep-Alive

# Mantiene el proyecto AppleFamily despierto haciendo una query simple cada 5
# días. Supabase Free pausa proyectos después de 7 días sin actividad; con 5
# días de intervalo tenemos margen por si la ejecución se retrasa.
#
# La publishable key (anon) es PÚBLICA — ya viaja en el bundle del frontend
# en NEXT_PUBLIC_SUPABASE_ANON_KEY. Por eso está hardcoded aquí sin problema.
# Si rotas la key, actualiza el valor abajo y vuelve a pushear.

on:
  schedule:
    # A las 09:00 UTC cada 5 días.
    - cron: '0 9 */5 * *'
  # Permite dispararlo manualmente desde la pestaña Actions para probarlo.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Keep AppleFamily Supabase project awake
        env:
          SUPABASE_URL: https://efsgxflltatbrbdvicxn.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_9ZQ3UWaf9SbMdIheQmpEuQ_ifvb0YZW
        run: |
          echo "Pinging $SUPABASE_URL ..."
          curl --fail --silent --show-error \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/trees?select=id&limit=1"
          echo ""
          echo "Project pinged — activity registered."
