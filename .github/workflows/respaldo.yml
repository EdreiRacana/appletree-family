name: Respaldo semanal de la base de datos

# Copia la base de datos de AppleFamily Tree cada domingo, la CIFRA con una
# contraseña que solo conoce el dueño y la guarda 30 días como artefacto.
# El repositorio es público: sin la contraseña el archivo no se puede abrir.
#
# Secretos necesarios (GitHub → Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL    Cadena de conexión "Session pooler" de Supabase (con la contraseña de la base).
#   BACKUP_PASSPHRASE  Contraseña para cifrar el respaldo. Guárdala en un lugar seguro: sin ella no se puede restaurar.
#
# Restaurar (en una computadora con PostgreSQL instalado):
#   openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in respaldo.tar.gz.enc -out respaldo.tar.gz -pass pass:"TU_CONTRASEÑA"
#   tar -xzf respaldo.tar.gz      →  publico.dump, cuentas.dump y la carpeta fotos/ (una subcarpeta por cubeta)
#   pg_restore --no-owner -d "CADENA_DE_CONEXION" publico.dump
#   pg_restore --no-owner --data-only -d "CADENA_DE_CONEXION" cuentas.dump

on:
  schedule:
    - cron: '0 8 * * 0'   # domingos 08:00 UTC (02:00 en CDMX)
  workflow_dispatch:       # también se puede correr a mano desde la pestaña Actions

permissions:
  contents: read

jobs:
  respaldo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Revisar secretos
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DB" ] || [ -z "$PASS" ]; then
            echo "::error::Faltan los secretos SUPABASE_DB_URL o BACKUP_PASSPHRASE."
            exit 1
          fi

      - name: Instalar cliente de PostgreSQL 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Copiar la base de datos
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          PGD=/usr/lib/postgresql/17/bin/pg_dump
          mkdir respaldo
          # Todo lo de la familia: tablas, reglas, funciones y datos.
          $PGD "$DB" --format=custom --no-owner --no-privileges --schema=public --file=respaldo/publico.dump
          # Cuentas de usuario y registro de archivos subidos (solo datos).
          $PGD "$DB" --format=custom --no-owner --no-privileges --data-only \
            --table=auth.users --table=auth.identities --table=storage.objects \
            --file=respaldo/cuentas.dump
          ls -la respaldo

      - name: Copiar las fotos
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          # Lista de archivos guardados (cubeta, público sí/no, ruta).
          /usr/lib/postgresql/17/bin/psql "$DB" -At -F $'\t' -c \
            "select o.bucket_id, b.public, o.name from storage.objects o join storage.buckets b on b.id = o.bucket_id where o.name is not null and right(o.name, 1) <> '/' order by 1, 3" \
            > lista_fotos.tsv
          python3 - <<'PY'
          import os, sys, urllib.parse, urllib.request
          base = 'https://efsgxflltatbrbdvicxn.supabase.co/storage/v1/object/public'
          ok = fallas = privadas = 0
          for line in open('lista_fotos.tsv', encoding='utf-8'):
              bucket, public, name = line.rstrip('\n').split('\t', 2)
              if public != 't':
                  privadas += 1
                  continue
              dest = os.path.join('respaldo', 'fotos', bucket, *name.split('/'))
              os.makedirs(os.path.dirname(dest), exist_ok=True)
              url = f"{base}/{urllib.parse.quote(bucket)}/{urllib.parse.quote(name)}"
              try:
                  with urllib.request.urlopen(url, timeout=60) as r, open(dest, 'wb') as f:
                      f.write(r.read())
                  ok += 1
              except Exception as e:
                  fallas += 1
                  print(f"No se pudo copiar un archivo de {bucket}: {e}")
          print(f"Fotos copiadas: {ok}  |  con error: {fallas}  |  en cubetas privadas (no copiadas): {privadas}")
          if ok == 0 and fallas > 0:
              sys.exit(1)
          PY
          rm -f lista_fotos.tsv
          du -sh respaldo/fotos 2>/dev/null || echo "Sin fotos"

      - name: Cifrar
        env:
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          tar -czf respaldo.tar.gz -C respaldo .
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in respaldo.tar.gz -out respaldo.tar.gz.enc -pass env:PASS
          rm -rf respaldo respaldo.tar.gz
          ls -la respaldo.tar.gz.enc

      - name: Guardar el respaldo (30 días)
        uses: actions/upload-artifact@v4
        with:
          name: respaldo-${{ github.run_number }}
          path: respaldo.tar.gz.enc
          retention-days: 30
          if-no-files-found: error
