# Configuracion Netlify para monorepo Next.js.
# Netlify auto-instala @netlify/plugin-nextjs cuando ve este toml en el root.

[build]
  base = "apps/web"
  command = "npm run build"
  publish = "apps/web/.next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"
