# Configuracion Netlify para monorepo Next.js.
# publish es relativo a base, por eso ".next" (no "apps/web/.next").

[build]
  base = "apps/web"
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"
